apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-node-labeler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-labeler-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-node-labeler-binding
subjects:
  - kind: ServiceAccount
    name: gpu-node-labeler
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: gpu-node-labeler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-node-labeler
  namespace: kube-system
  labels:
    app: gpu-node-labeler
spec:
  selector:
    matchLabels:
      app: gpu-node-labeler
  template:
    metadata:
      labels:
        app: gpu-node-labeler
    spec:
      serviceAccountName: gpu-node-labeler
      # 容忍度: 允许调度到已有 GPU 污点或 Master 节点上
      tolerations:
        - operator: Exists
      containers:
        - name: labeler
          image: your-registry.com/infra/gpu-node-labeler:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            # Downward API 获取当前 Pod 所在节点的名称
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # 同步周期(秒)
            - name: SYNC_INTERVAL_SECONDS
              value: "300"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: LABEL_PREFIX
              value: "gpu.custom.io"
            # 激活 NVIDIA Runtime 支持, 挂载 NVML 库到容器内
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "utility"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
